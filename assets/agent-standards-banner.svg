<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="auto" role="img" aria-label="Agent Standards Hero Banner">
  <defs>
    <!-- Background Gradient: Deep Cobalt Canvas -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C" />
      <stop offset="40%" stop-color="#0C1427" />
      <stop offset="80%" stop-color="#060A14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="leftCoreGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#1D4ED8" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#1E1B4B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightAccentGlow" cx="80%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- High-Tech Linear Gradients -->
    <linearGradient id="cyanCobaltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="titlePlatinum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="darkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Filters -->
    <filter id="coreBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Precision Tech Background Grid -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Canvas Background Plate -->
  <rect width="1280" height="420" rx="20" fill="url(#bannerBg)" stroke="#1E293B" stroke-width="2" />
  <rect width="1280" height="420" rx="20" fill="url(#techGrid)" />

  <!-- Ambient Light Overlays -->
  <rect width="1280" height="420" rx="20" fill="url(#leftCoreGlow)" />
  <rect width="1280" height="420" rx="20" fill="url(#rightAccentGlow)" />

  <!-- Outer Tech Corner Accents -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.65">
    <path d="M 28 48 L 28 28 L 48 28" fill="none" />
    <path d="M 1232 28 L 1252 28 L 1252 48" fill="none" />
    <path d="M 28 372 L 28 392 L 48 392" fill="none" />
    <path d="M 1232 392 L 1252 392 L 1252 372" fill="none" />
  </g>

  <!-- Data Bus Circuit Lines (Connecting Emblem to Typography) -->
  <g opacity="0.4" stroke="#38BDF8" stroke-width="1" fill="none">
    <path d="M 380 210 L 460 210 L 485 160 L 525 160" />
    <path d="M 360 140 L 440 140 L 465 100 L 510 100" stroke-dasharray="4 4" />
    <path d="M 360 280 L 430 280 L 460 325 L 530 325" stroke-dasharray="6 6" />
    <circle cx="525" cy="160" r="3" fill="#00F0FF" />
    <circle cx="510" cy="100" r="2.5" fill="#38BDF8" />
    <circle cx="530" cy="325" r="3" fill="#2563EB" />
  </g>

  <!-- ======================================================== -->
  <!-- LEFT EMBLEM: AGENT STANDARDS COMPASS & CONTEXT ORBITS    -->
  <!-- Center: x=220, y=210                                     -->
  <!-- ======================================================== -->
  <g id="standards-emblem" filter="url(#shadowFilter)">
    <!-- Base Outer Track (r=148) -->
    <circle cx="220" cy="210" r="148" fill="#090E1E" stroke="#1E293B" stroke-width="8" />
    <circle cx="220" cy="210" r="148" fill="none" stroke="url(#cyanCobaltGrad)" stroke-width="2" stroke-opacity="0.9" />

    <!-- 16 Calibration Teeth -->
    <g fill="#E2E8F0" stroke="#090E1E" stroke-width="0.8" opacity="0.85">
      <rect x="216" y="56" width="8" height="12" rx="2" />
      <rect x="216" y="352" width="8" height="12" rx="2" />
      <rect x="66" y="206" width="12" height="8" rx="2" />
      <rect x="362" y="206" width="12" height="8" rx="2" />

      <rect x="216" y="56" width="8" height="12" rx="2" transform="rotate(45 220 210)" />
      <rect x="216" y="352" width="8" height="12" rx="2" transform="rotate(45 220 210)" />
      <rect x="66" y="206" width="12" height="8" rx="2" transform="rotate(45 220 210)" />
      <rect x="362" y="206" width="12" height="8" rx="2" transform="rotate(45 220 210)" />

      <rect x="216" y="56" width="8" height="12" rx="2" transform="rotate(22.5 220 210)" />
      <rect x="216" y="352" width="8" height="12" rx="2" transform="rotate(22.5 220 210)" />
      <rect x="66" y="206" width="12" height="8" rx="2" transform="rotate(22.5 220 210)" />
      <rect x="362" y="206" width="12" height="8" rx="2" transform="rotate(22.5 220 210)" />

      <rect x="216" y="56" width="8" height="12" rx="2" transform="rotate(67.5 220 210)" />
      <rect x="216" y="352" width="8" height="12" rx="2" transform="rotate(67.5 220 210)" />
      <rect x="66" y="206" width="12" height="8" rx="2" transform="rotate(67.5 220 210)" />
      <rect x="362" y="206" width="12" height="8" rx="2" transform="rotate(67.5 220 210)" />
    </g>

    <!-- Calibration Degree Track -->
    <circle cx="220" cy="210" r="140" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 12.2" opacity="0.75" />

    <!-- 5-Tier Interlocking Rings -->
    <!-- Tier 5: Raw Full Text & Memory (r=122) -->
    <circle cx="220" cy="210" r="122" fill="none" stroke="url(#cyanCobaltGrad)" stroke-width="2.5"
            stroke-dasharray="40 14 25 12 50 15" stroke-linecap="round" opacity="0.9" />

    <!-- Tier 4: Extracted AST Facts (r=104) -->
    <circle cx="220" cy="210" r="104" fill="none" stroke="#2563EB" stroke-width="2"
            stroke-dasharray="30 12 45 14" stroke-linecap="round" opacity="0.85" />
    <circle cx="324" cy="210" r="3.5" fill="#00F0FF" filter="url(#neonGlow)" />
    <circle cx="116" cy="210" r="3.5" fill="#00F0FF" filter="url(#neonGlow)" />

    <!-- Tier 3: Summary Cards & Area Guides (r=86) -->
    <circle cx="220" cy="210" r="86" fill="none" stroke="#E2E8F0" stroke-width="2" opacity="0.75" />
    <circle cx="220" cy="210" r="86" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="220" cy="124" r="3" fill="#FFFFFF" filter="url(#neonGlow)" />
    <circle cx="220" cy="296" r="3" fill="#FFFFFF" filter="url(#neonGlow)" />

    <!-- Tier 2: Metadata Index & Manifests (r=68) -->
    <circle cx="220" cy="210" r="68" fill="none" stroke="url(#cyanCobaltGrad)" stroke-width="3"
            stroke-dasharray="50 10 50 10" stroke-linecap="round" />

    <!-- Tier 1: Fast Routing Base Foundation (r=50) -->
    <circle cx="220" cy="210" r="50" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="220" cy="210" r="50" fill="none" stroke="#00F0FF" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- A2A Interaction Handshake Arcs (Emblem scale) -->
    <path d="M 130 210 C 130 140, 310 140, 310 210"
          fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6 4" filter="url(#neonGlow)" />
    <path d="M 310 210 C 310 280, 130 280, 130 210"
          fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" />
    <!-- Dispatch & Result Mini Envelopes -->
    <rect x="212" y="152" width="16" height="10" rx="2" fill="#0B132B" stroke="#00F0FF" stroke-width="1.2" />
    <polyline points="214,154 220,158 226,154" fill="none" stroke="#00F0FF" stroke-width="1" />
    <rect x="212" y="258" width="16" height="10" rx="2" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2" />
    <polyline points="214,266 220,262 226,266" fill="none" stroke="#38BDF8" stroke-width="1" />

    <!-- Normative Compass Star (Faceted) -->
    <!-- North Blade -->
    <polygon points="220,210 220,132 214,204" fill="url(#platinumGrad)" />
    <polygon points="220,210 220,132 226,204" fill="#1D4ED8" />
    <!-- South Blade -->
    <polygon points="220,210 220,288 226,216" fill="url(#platinumGrad)" />
    <polygon points="220,210 220,288 214,216" fill="#1D4ED8" />
    <!-- East Blade -->
    <polygon points="220,210 298,210 226,204" fill="url(#platinumGrad)" />
    <polygon points="220,210 298,210 226,216" fill="#2563EB" />
    <!-- West Blade -->
    <polygon points="220,210 142,210 214,216" fill="url(#platinumGrad)" />
    <polygon points="220,210 142,210 214,204" fill="#2563EB" />
    <!-- Ordinal Diagonal Blades -->
    <polygon points="220,210 265,165 224,202" fill="#E2E8F0" />
    <polygon points="220,210 265,165 228,206" fill="#0284C7" />
    <polygon points="220,210 175,165 212,206" fill="#E2E8F0" />
    <polygon points="220,210 175,165 216,202" fill="#0284C7" />
    <polygon points="220,210 265,255 228,214" fill="#CBD5E1" />
    <polygon points="220,210 265,255 224,218" fill="#1E3A8A" />
    <polygon points="220,210 175,255 216,218" fill="#CBD5E1" />
    <polygon points="220,210 175,255 212,214" fill="#1E3A8A" />

    <!-- Center Compass Shield & Nucleus -->
    <polygon points="220,186 238,194 244,210 238,226 220,234 202,226 196,210 202,194"
             fill="#0B132B" stroke="#00F0FF" stroke-width="1.8" filter="url(#neonGlow)" />
    <polygon points="220,192 234,210 220,228 206,210"
             fill="#1E293B" stroke="url(#platinumGrad)" stroke-width="1.2" />
    <polygon points="220,198 230,210 220,222 210,210" fill="#00F0FF" filter="url(#coreBloom)" />
    <circle cx="220" cy="210" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT CONTENT AREA: TYPOGRAPHY, BADGES & FEATURE PILLS  -->
  <!-- ======================================================== -->
  <g id="typography-and-content">
    <!-- Authority Status Capsule -->
    <g transform="translate(430, 54)">
      <rect width="430" height="28" rx="14" fill="#1E293B" stroke="url(#cyanCobaltGrad)" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="4.5" fill="#00F0FF" filter="url(#neonGlow)" />
      <text x="32" y="18.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2.2">KOALITY-ASSURED SPECIFICATIONS</text>
      <text x="382" y="18.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="10" font-weight="600" fill="#94A3B8">v1.0</text>
    </g>

    <!-- Main Title -->
    <text x="430" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="44" font-weight="800" fill="url(#titlePlatinum)" letter-spacing="1">
      AGENT STANDARDS
    </text>

    <!-- Tagline / Mission -->
    <text x="430" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
      Normative Specifications for Context Hierarchies, A2A Interaction Protocols &amp; Security Invariants
    </text>

    <!-- Interactive Technical Feature Cards (4 Column Grid) -->
    <g transform="translate(430, 196)">
      <!-- Card 1: 5-Tier Context Management -->
      <g transform="translate(0, 0)">
        <rect width="186" height="170" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
        <rect x="0" y="0" width="186" height="3" rx="1.5" fill="#00F0FF" />
        <circle cx="22" cy="24" r="5" fill="#00F0FF" filter="url(#neonGlow)" />
        <text x="34" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">5-TIER CONTEXT</text>
        <text x="14" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="600" fill="#38BDF8">• T1: Fast Routing</text>
        <text x="14" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• T2: Catalog Index</text>
        <text x="14" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• T3: Summary Cards</text>
        <text x="14" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• T4: AST Fact Graphs</text>
        <text x="14" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• T5: Raw Full Text</text>
        <rect x="14" y="146" width="158" height="16" rx="4" fill="#0B132B" />
        <text x="93" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="9" font-weight="700" fill="#00F0FF">HEADROOM PRESERVATION</text>
      </g>

      <!-- Card 2: A2A Protocol -->
      <g transform="translate(202, 0)">
        <rect width="186" height="170" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
        <rect x="0" y="0" width="186" height="3" rx="1.5" fill="#38BDF8" />
        <circle cx="22" cy="24" r="5" fill="#38BDF8" filter="url(#neonGlow)" />
        <text x="34" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">A2A PROTOCOL</text>
        <text x="14" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="600" fill="#38BDF8">• Envelope Schema</text>
        <text x="14" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• Exchange Budgets</text>
        <text x="14" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• Heartbeat Liveness</text>
        <text x="14" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• Clean Isolation</text>
        <text x="14" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• Untrusted Defense</text>
        <rect x="14" y="146" width="158" height="16" rx="4" fill="#0B132B" />
        <text x="93" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="9" font-weight="700" fill="#38BDF8">RFC 2119 CONFORMANCE</text>
      </g>

      <!-- Card 3: Security MUSTs -->
      <g transform="translate(404, 0)">
        <rect width="186" height="170" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
        <rect x="0" y="0" width="186" height="3" rx="1.5" fill="#2563EB" />
        <circle cx="22" cy="24" r="5" fill="#2563EB" filter="url(#neonGlow)" />
        <text x="34" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">SECURITY MUSTS</text>
        <text x="14" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="600" fill="#38BDF8">• SEC-01 Tool Sandbox</text>
        <text x="14" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• SEC-02 AST Verification</text>
        <text x="14" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• SEC-03 Secret Scrub</text>
        <text x="14" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• SEC-04 Poison Defend</text>
        <text x="14" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• SEC-05 Worktree Iso</text>
        <rect x="14" y="146" width="158" height="16" rx="4" fill="#0B132B" />
        <text x="93" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="9" font-weight="700" fill="#2563EB">PROVABLE INVARIANTS</text>
      </g>

      <!-- Card 4: Cost Layers & Efficiency -->
      <g transform="translate(606, 0)">
        <rect width="186" height="170" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
        <rect x="0" y="0" width="186" height="3" rx="1.5" fill="#818CF8" />
        <circle cx="22" cy="24" r="5" fill="#818CF8" filter="url(#neonGlow)" />
        <text x="34" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="12" font-weight="700" fill="#FFFFFF">COST LAYERS</text>
        <text x="14" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="600" fill="#38BDF8">• qmd Hybrid Retrieval</text>
        <text x="14" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• ast-grep Structural</text>
        <text x="14" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• Headroom Compress</text>
        <text x="14" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• 85%+ Token Savings</text>
        <text x="14" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="10.5" font-weight="500" fill="#CBD5E1">• Clean-Slate Spawns</text>
        <rect x="14" y="146" width="158" height="16" rx="4" fill="#0B132B" />
        <text x="93" y="157" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
              font-size="9" font-weight="700" fill="#818CF8">TOKEN OPTIMIZATION</text>
      </g>
    </g>
  </g>
</svg>
